  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Tamam Studio Technology","alternateName":"tamam.","url":"https://tamamstudio.ai/","logo":"https://tamamstudio.ai/apple-touch-icon.png","slogan":"Think big. We’ll handle the rest.","description":"Tamam Studio Technology makes apps, media and AI products for people and businesses."}</script>
  <style>
    :root{--bg:#F4F5F0;--ink:#10231C;--muted:#5B6F64;--forest:#0E4A3A;--green:#1FBF75;--line:#DDE2DA}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse 45% 60% at 88% 18%,#E3F3E6 0,transparent 100%),var(--bg);color:var(--ink);font-family:"Instrument Sans",Arial,sans-serif}
    main{flex:1;width:min(1240px,100%);margin:0 auto;padding:clamp(48px,10vh,120px) clamp(20px,5vw,64px) 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:40px}
    .over{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.17em;text-transform:uppercase;color:var(--forest);margin:0 0 22px}
    h1{margin:0;font:800 clamp(84px,14vw,176px)/.95 Manrope,Arial,sans-serif;letter-spacing:-.045em;color:var(--forest)}
    h1 span{color:var(--green)}
    .slogan{margin:34px 0 6px;font-weight:600;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.01em}
    .slogan-tr{margin:0;font-size:clamp(17px,1.8vw,21px);color:var(--muted)}
    .soon{margin:44px 0 0;padding-top:22px;border-top:1px solid var(--line);max-width:520px;color:var(--muted);font-size:17px;line-height:1.55}
    .soon b{color:var(--ink);font-weight:600}
    .art{width:100%;height:auto;max-width:540px;justify-self:end}
    footer{width:min(1240px,100%);margin:0 auto;padding:22px clamp(20px,5vw,64px) 30px;font-size:13px;color:var(--muted)}
    @media(max-width:800px){main{grid-template-columns:1fr;padding-top:48px;gap:8px}.art{justify-self:start;max-width:300px;margin:0 0 0 -12px}}
  </style>
</head>
<body>
  <main>
    <div>
      <p class="over">Tamam Studio Technology</p>
      <h1>tamam<span>.</span></h1>
      <p class="slogan">Think big. We’ll handle the rest.</p>
      <p class="slogan-tr" lang="tr">Büyük düşünün. Gerisini tamamlarız.</p>
      <p class="soon"><b>Our new site is on its way.</b> We make apps, media and AI products for people and businesses.<br><span lang="tr">Yeni sitemiz çok yakında.</span></p>
    </div>
    <img class="art" src="tamam-hero-illustration.svg" alt="" width="1180" height="1000">
  </main>
  <footer>© 2026 Tamam Studio Technology</footer>
</body>
</html>
